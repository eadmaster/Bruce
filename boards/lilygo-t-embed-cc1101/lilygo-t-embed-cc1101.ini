
[env:lilygo-t-embed-cc1101]	
board = lilygo-t-embed-cc1101
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-O2
	-DMIC_SPM1423
	-DCORE_DEBUG_LEVEL=5

	-DRF_TX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Default", 2}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Default", 1}, {"Pin 43", 43}, {"Pin 44", 44}}'

	; rtl_433_ESP flags https://github.com/NorthernMan54/rtl_433_ESP/blob/main/example/OOK_Receiver/platformio.ini
	-DOOK_MODULATION=true      ; False is FSK, True is OOK
	-DRF_CC1101="CC1101"
	-DRTL_DEBUG=0
	;-DMINRSSI=-82
	-DRF_MODULE_GDO0=CC1101_GDO0_PIN
	-DRF_MODULE_SCK=CC1101_SCK_PIN
	-DRF_MODULE_MISO=CC1101_MISO_PIN
	-DRF_MODULE_MOSI=CC1101_MOSI_PIN
	-DRF_MODULE_CS=CC1101_SS_PIN
	-DRF_MODULE_GDO0=CC1101_GDO0_PIN
	-DRF_MODULE_GDO2=CC1101_GDO2_PIN
	-DRF_MODULE_INIT_STATUS=false

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.2.7
	mathertel/RotaryEncoder @1.5.3
	fastled/FastLED @3.9.4
	https://github.com/eadmaster/rtl_433_ESP
